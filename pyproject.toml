[project]
name = "logs2report"
version = "0.1.0"
description = "CLI app para transformar logs a reporte tabular."
readme = "README.md"
authors = [
    { name = "Isaul Tirado", email = "tiradolisaul@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "pandas>=3.0.5",
    "pytest>=9.1.1",
]

[project.scripts]
log2report = "logs2report.cli:main"

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"
